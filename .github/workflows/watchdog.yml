name: VPS Watchdog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: vps-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RCLONE_CONFIG: /tmp/rclone.conf
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET || 'vps-relay' }}
      STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'auto' }}
      STORAGE_REPO: ${{ secrets.STORAGE_REPO }}
      STORAGE_REPO_PAT: ${{ secrets.STORAGE_REPO_PAT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          cd /tmp && unzip -o rclone.zip >/dev/null
          sudo cp /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version

      - name: Check lease and recover if needed
        run: bash scripts/watchdog.sh
