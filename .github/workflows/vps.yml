name: VPS Relay

on:
  workflow_dispatch:
    inputs:
      skip_restore:
        description: 'Start fresh without restoring from Drive'
        type: boolean
        default: false
  repository_dispatch:
    types: [handoff]

concurrency:
  group: vps-relay
  cancel-in-progress: false

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      RCLONE_CONFIG: /tmp/rclone.conf
      GDRIVE_SA_FILE: /tmp/gdrive-sa.json
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      HANDOFF_PAT: ${{ secrets.HANDOFF_PAT }}
      CF_TUNNEL_CREDS: ${{ secrets.CF_TUNNEL_CREDS }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      RUN_ID: ${{ github.run_id }}
      SKIP_RESTORE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_restore || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          cd /tmp && unzip -o rclone.zip >/dev/null
          sudo cp /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version

      - name: Enable KVM and install LXD
        run: |
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          sudo snap install lxd
          sudo lxd init --minimal
          export PATH="$PATH:/snap/bin"
          # dir storage (lxd init --minimal default) cannot host VMs: create a
          # dedicated VM-capable pool (btrfs on a loop file).
          sudo lxc storage create vmpool btrfs size=12GiB \
            || sudo lxc storage create vmpool zfs size=12GiB
          # lxd init --minimal may not leave a NAT'd bridge; ensure one exists
          # and the default profile uses it (the VM has no outbound net without
          # this, so cloudflared can never reach Cloudflare).
          if ! sudo lxc network show lxdbr0 >/dev/null 2>&1; then
            sudo lxc network create lxdbr0 ipv4.address=10.10.0.1/24 \
              ipv4.nat=true ipv4.dhcp=true ipv6.address=none
          fi
          sudo lxc network set lxdbr0 ipv4.nat=true ipv4.dhcp=true
          sudo lxc profile device set default eth0 network=lxdbr0
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo lxc network show lxdbr0
          sudo lxc profile show default
          lxc version

      - name: Restore state from Drive
        run: bash scripts/restore.sh

      - name: Acquire lease
        run: bash scripts/lease.sh acquire "${{ github.repository }}" "${{ github.run_id }}"

      - name: Start VPS VM (LXD)
        run: bash scripts/vm.sh

      - name: Start cloudflared tunnel (host)
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod 755 /usr/local/bin/cloudflared
          echo "$CF_TUNNEL_TOKEN" > /tmp/cf-tunnel-token
          nohup cloudflared tunnel run --token "$CF_TUNNEL_TOKEN" >/tmp/cloudflared.log 2>&1 &
          echo "cloudflared pid $!"
          sleep 12
          echo "--- cloudflared.log ---"
          cat /tmp/cloudflared.log 2>/dev/null | tail -40 || echo "(no cloudflared log)"
          curl -s -o /dev/null -w "tunnel http=%{http_code}\n" --max-time 15 https://con.devgorge.com || true

      - name: Start heartbeat (background)
        run: |
          nohup bash scripts/heartbeat.sh "${{ github.repository }}" "${{ github.run_id }}" >/tmp/heartbeat.log 2>&1 &
          echo "heartbeat pid $!"

      - name: Hold -> backup -> handoff
        run: bash scripts/loop.sh

      - name: Stop heartbeat
        if: always()
        run: pkill -f 'scripts/heartbeat.sh' || true
