name: VPS Relay

on:
  workflow_dispatch:
    inputs:
      skip_restore:
        description: 'Start fresh without restoring from Drive'
        type: boolean
        default: false
      skip_docker:
        description: 'Skip Docker backup/restore (saves disk space)'
        type: boolean
        default: false
  repository_dispatch:
    types: [handoff]

concurrency:
  group: vps-relay
  cancel-in-progress: false

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      RCLONE_CONFIG: /tmp/rclone.conf
      GDRIVE_SA_FILE: /tmp/gdrive-sa.json
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      HANDOFF_PAT: ${{ secrets.HANDOFF_PAT }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      RUN_ID: ${{ github.run_id }}
      SKIP_RESTORE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_restore || 'false' }}
      SKIP_DOCKER: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_docker) || vars.SKIP_DOCKER || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h / | tail -1
          sudo rm -rf /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup \
            /usr/share/dotnet /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/share/firefox /snap /usr/local/share/vcpkg \
            /usr/local/share/miniconda /usr/local/share/pnpm \
            /usr/share/swift \
            /usr/local/julia* 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* /var/tmp/* 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          echo "Disk after cleanup:"
          df -h / | tail -1

      - name: Install dependencies
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          cd /tmp && unzip -o rclone.zip >/dev/null
          sudo cp /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          sudo npm install -g pm2

          echo "deps installed"
          rclone version
          cloudflared --version
          pm2 --version

      - name: Configure SSH (host)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server >/dev/null
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/99-relay-auth.conf >/dev/null
          echo 'root:Frank986532' | sudo chpasswd
          sudo mkdir -p /run/sshd
          sudo systemctl restart sshd 2>/dev/null || sudo /usr/sbin/sshd
          sleep 1
          ss -tln | grep ':22 ' || { echo "ERROR: sshd not listening on 22"; exit 1; }

      - name: Restore state from Drive
        run: bash scripts/restore.sh

      - name: Free disk after restore
        run: |
          sudo rm -rf /var/tmp/* /tmp/restore 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          echo "Disk after post-restore cleanup:"
          df -h / | tail -1

      - name: Start cloudflared tunnel
        run: |
          if [ -n "${CF_TUNNEL_TOKEN:-}" ]; then
            mkdir -p /tmp/cf
            printf '%s' "$CF_TUNNEL_TOKEN" > /tmp/cf/token
            chmod 600 /tmp/cf/token
            nohup cloudflared tunnel run --token "$(cat /tmp/cf/token)" \
              >/tmp/cloudflared.log 2>&1 &
            echo "cloudflared started (token tunnel)"
            sleep 3
            grep -oE '"level":"[^"]*"' /tmp/cloudflared.log | tail -2
          else
            echo "CF_TUNNEL_TOKEN not set; no tunnel"
          fi

      - name: Start pm2 services
        run: |
          if [ -f "$GITHUB_WORKSPACE/services/ecosystem.config.js" ]; then
            pm2 start "$GITHUB_WORKSPACE/services/ecosystem.config.js" 2>/dev/null || true
          fi
          pm2 save 2>/dev/null || true
          pm2 status

      - name: Start heartbeat (background)
        run: |
          nohup bash scripts/heartbeat.sh "${{ github.repository }}" "${{ github.run_id }}" >/tmp/heartbeat.log 2>&1 &
          echo "heartbeat pid $!"

      - name: Hold -> backup -> handoff
        run: bash scripts/loop.sh

      - name: Stop heartbeat
        if: always()
        run: pkill -f 'scripts/heartbeat.sh' || true
